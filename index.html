<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>背誓者 — 互動敘事地圖</title>
<style>
:root {
  --bg: #0a0a10;
  --bg2: #12111c;
  --bg3: #1a1828;
  --text: #d8d4e0;
  --text2: #8a8499;
  --text3: #524d66;
  --accent: #c62828;
  --accent2: #6a1b9a;
  --accent-glow: rgba(198,40,40,0.15);
  --accent2-glow: rgba(106,27,154,0.15);
  --border: #2a2640;
  --card: #141320;
  --card-hover: #1c1a2c;
  --warm: #e65100;
  --gold: #ffab00;
  --tag-char: #ce93d8;
  --tag-loc: #ef5350;
  --tag-action: #ff8a65;
  --tag-cond: #b39ddb;
  --tag-bg: rgba(198,40,40,0.12);
  --tag-text: #ef9a9a;
  --success: #66bb6a;
  --radius: 8px;
  --shadow: 0 2px 16px rgba(0,0,0,0.5);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  height: 100vh;
  overflow: hidden;
}
.app { display: flex; height: 100vh; flex-direction: column; }

/* === Game Banner === */
.game-banner {
  background: linear-gradient(135deg, #1a0a0a 0%, #1c0a20 40%, #0f0a18 100%);
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}
.game-banner::before {
  content: '';
  position: absolute;
  top: -40%; right: -5%;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(198,40,40,0.1), transparent 60%);
  pointer-events: none;
}
.game-banner::after {
  content: '';
  position: absolute;
  bottom: -60%; left: 15%;
  width: 350px; height: 350px;
  background: radial-gradient(circle, rgba(106,27,154,0.08), transparent 60%);
  pointer-events: none;
}
.banner-top { display: flex; align-items: center; gap: 16px; position: relative; z-index: 1; }
.banner-icon {
  width: 52px; height: 52px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
  box-shadow: 0 4px 20px rgba(198,40,40,0.4);
  border: 1px solid rgba(198,40,40,0.3);
}
.banner-text h1 {
  font-size: 24px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 1px;
}
.banner-text .subtitle {
  font-size: 12px;
  color: rgba(255,255,255,0.4);
  margin-top: 2px;
}
.banner-stats {
  display: flex; gap: 16px; flex-wrap: wrap;
  margin-top: 12px;
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  position: relative; z-index: 1;
}
.stat-item { display: flex; align-items: center; gap: 4px; }
.stat-item b { color: var(--accent); }
.char-avatars {
  display: flex; gap: 4px; margin-left: auto;
  position: relative; z-index: 1;
}
.char-avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  color: #fff;
  border: 2px solid rgba(255,255,255,0.15);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  overflow: hidden;
  background-size: cover;
  background-position: center;
}
.char-avatar img {
  width: 100%; height: 100%;
  object-fit: cover;
  border-radius: 50%;
}
.char-avatar:hover {
  transform: scale(1.15);
  box-shadow: 0 0 12px rgba(255,255,255,0.2);
}

/* === Toolbar === */
.toolbar {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.search-wrap {
  position: relative;
  flex-shrink: 1;
  min-width: 140px;
}
.search-wrap::before {
  content: '\1F50D';
  position: absolute;
  left: 10px; top: 50%;
  transform: translateY(-50%);
  font-size: 13px;
  pointer-events: none;
  z-index: 1;
}
.search-wrap .search-box { width: 100%; padding-left: 32px; }
.search-box {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  width: 240px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-box:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.search-box::placeholder { color: var(--text3); }
.toolbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}
.toggle-row {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--text2);
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
}
.toggle-row input { accent-color: var(--accent); cursor: pointer; width: 14px; height: 14px; }
.toggle-row:hover { color: var(--text); }
.view-toggle { display: flex; gap: 3px; }
.view-btn {
  padding: 5px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  font-size: 11px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.view-btn:hover { background: var(--bg3); color: var(--text); }
.view-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  box-shadow: 0 2px 10px rgba(198,40,40,0.35);
}
.filter-row {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.filter-chip {
  padding: 3px 10px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.filter-chip:hover { border-color: var(--text2); color: var(--text); }
.filter-chip.active {
  background: var(--accent2-glow);
  border-color: var(--accent2);
  color: var(--accent2);
}

/* === Content === */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px 60px;
  scroll-behavior: smooth;
}

/* === Group Headers === */
.group-header {
  width: 100%;
  background: linear-gradient(135deg, var(--bg3), var(--bg2));
  padding: 14px 20px;
  margin: 16px 0 4px 0;
  border-radius: var(--radius);
  position: sticky;
  top: 0; z-index: 10;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  transition: border-color 0.2s;
}
.group-header:first-child { margin-top: 0; }
.group-header:hover { border-color: var(--accent); }
.group-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
}
.group-arrow {
  font-size: 10px;
  color: var(--text3);
  transition: transform 0.2s;
  flex-shrink: 0;
}
.group-arrow.open { transform: rotate(90deg); }
.group-info { flex: 1; min-width: 0; }
.group-header h2 {
  font-size: 16px; font-weight: 600; color: #fff;
  margin: 0; border: none; padding: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.group-header .group-name-en {
  font-size: 11px; color: var(--text3); margin-top: 1px;
}
.group-header .group-stats {
  font-size: 11px; color: var(--text2); flex-shrink: 0;
  display: flex; align-items: center; gap: 8px;
}
.group-header .group-stats b { color: var(--accent); }
.group-body { display: none; padding: 2px 0; }
.group-body.open { display: block; }

/* === Passage Cards === */
.passage {
  background: var(--card);
  padding: 14px 18px;
  margin: 4px 0;
  border-radius: 8px;
  border-left: 3px solid transparent;
  transition: all 0.2s;
  position: relative;
}
.passage:hover {
  border-left-color: var(--accent);
  background: var(--card-hover);
}
.passage-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.passage-title {
  font-size: 13px; font-weight: 600;
  color: var(--accent);
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.passage .pid {
  font-size: 10px; color: var(--text3);
  font-family: 'Consolas', monospace; flex-shrink: 0;
}
.passage .pname {
  font-size: 11px; color: var(--tag-text);
  margin-bottom: 4px; font-family: monospace;
}
.passage .tag-row { margin-bottom: 6px; display: flex; flex-wrap: wrap; gap: 3px; }
.passage .tag {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 500;
}
.tag-char { background: rgba(206,147,216,0.12); color: var(--tag-char); }
.tag-cond { background: rgba(179,157,219,0.12); color: var(--tag-cond); }
.tag-default { background: rgba(255,255,255,0.06); color: var(--text2); }
.char-pills { margin-bottom: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
.char-pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10px; font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s;
}
.char-pill:hover { transform: scale(1.05); }
.passage .text {
  font-size: 14px; line-height: 1.85;
  color: var(--text);
  white-space: pre-wrap; word-break: break-word;
}
.passage .text-en {
  font-size: 12px; color: var(--text2);
  margin-top: 8px; padding-top: 8px;
  border-top: 1px dashed var(--border);
  font-style: italic; line-height: 1.6;
  white-space: pre-wrap;
  max-height: 120px; overflow: hidden;
  position: relative;
}
.passage .text-en.collapsed::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 40px;
  background: linear-gradient(transparent, var(--card));
  pointer-events: none;
}
.passage .choices-row {
  margin-top: 8px; padding-top: 8px;
  border-top: 1px solid var(--border);
  display: flex; flex-wrap: wrap; gap: 4px;
}
.choice-btn {
  padding: 3px 10px;
  border-radius: 14px;
  background: var(--accent-glow);
  border: 1px solid rgba(198,40,40,0.25);
  color: var(--accent);
  font-size: 11px;
  cursor: default;
  transition: all 0.15s;
}
.passage-img {
  max-width: 100%;
  max-height: 400px;
  border-radius: 8px;
  margin: 8px 0;
  display: block;
}

/* === Character View === */
.char-section {
  margin: 12px 0;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.char-section-header {
  padding: 14px 18px;
  background: var(--bg2);
  display: flex; align-items: center; gap: 12px;
  cursor: pointer; user-select: none;
  transition: background 0.15s;
}
.char-section-header:hover { background: var(--bg3); }
.char-section-avatar {
  width: 48px; height: 48px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; color: #fff;
  flex-shrink: 0;
  overflow: hidden;
  background-size: cover;
  background-position: center;
}
.char-section-avatar img {
  width: 100%; height: 100%;
  object-fit: cover;
  border-radius: 50%;
}
.char-portrait-full {
  width: 100%;
  max-width: 280px;
  border-radius: 12px;
  border: 2px solid var(--border);
  margin: 8px auto;
  display: block;
  box-shadow: var(--shadow);
}

/* === CG Gallery === */
.cg-gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
  padding: 8px 0;
}
.cg-item {
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  position: relative;
}
.cg-item:hover {
  transform: scale(1.03);
  border-color: var(--accent);
  box-shadow: 0 4px 20px rgba(198,40,40,0.3);
}
.cg-item img {
  width: 100%;
  display: block;
  aspect-ratio: 4/3;
  object-fit: cover;
}
.cg-item .cg-label {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,0.8));
  padding: 20px 8px 6px;
  font-size: 11px;
  color: rgba(255,255,255,0.8);
}
.cg-lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.cg-lightbox img {
  max-width: 90vw;
  max-height: 90vh;
  border-radius: 8px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6);
}
.cg-lightbox .close-btn {
  position: absolute;
  top: 20px; right: 24px;
  font-size: 28px;
  color: #fff;
  cursor: pointer;
  opacity: 0.7;
  transition: opacity 0.2s;
}
.cg-lightbox .close-btn:hover { opacity: 1; }
.char-section-info { flex: 1; min-width: 0; }
.char-section-info h3 {
  font-size: 16px; font-weight: 600; color: #fff;
}
.char-section-info .meta {
  font-size: 12px; color: var(--text2);
}
.char-section-body { display: none; }
.char-section-body.open { display: block; padding: 4px 8px 8px; }

/* === Scene View sub cards === */
.scene-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin: 6px 0;
  overflow: hidden;
  transition: border-color 0.2s;
}
.scene-card:hover { border-color: var(--accent); }

/* === Condition Tags === */
.cond-block {
  margin: 8px 0 4px 0;
  padding: 4px 8px;
  border-left: 2px solid var(--tag-cond);
  background: rgba(179,157,219,0.05);
  border-radius: 0 4px 4px 0;
}
.cond-label {
  font-size: 10px;
  color: var(--tag-cond);
  font-family: 'Consolas', monospace;
  margin-bottom: 2px;
}

/* === States === */
.loading {
  text-align: center; padding: 80px 20px; color: var(--text2);
}
.loading .spinner {
  display: inline-block;
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state {
  text-align: center; padding: 60px 20px;
  color: var(--text2); font-size: 14px;
}

/* === Scrollbar === */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* === Keyboard hint === */
.kb-hint {
  position: fixed; bottom: 12px; right: 16px;
  font-size: 10px; color: var(--text3);
  pointer-events: none; z-index: 100;
}
.kb-hint kbd {
  padding: 1px 4px; border-radius: 3px;
  background: var(--bg2); border: 1px solid var(--border);
  font-family: inherit;
}

/* === Mobile === */
@media (max-width: 768px) {
  .game-banner { padding: 16px; }
  .banner-top h1 { font-size: 20px; }
  .char-avatars { display: none; }
  .content { padding: 10px 12px 40px; }
  .passage .text { font-size: 15px; line-height: 1.9; }
  .toolbar { padding: 6px 10px; gap: 6px; }
  .search-wrap { width: 100%; }
  .search-box { width: 100%; }
  .toolbar-right { margin-left: 0; width: 100%; flex-wrap: wrap; justify-content: center; }
  .view-toggle { width: 100%; justify-content: center; }
  .filter-row { width: 100%; justify-content: center; }
  .group-header { padding: 10px 14px; }
  .group-header h2 { font-size: 15px; }
  .kb-hint { display: none; }
  .cg-gallery { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .char-portrait-full { max-width: 200px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="game-banner">
    <div class="banner-top">
      <div class="banner-icon">OB</div>
      <div class="banner-text">
        <h1 id="gameTitle">背誓者</h1>
        <div class="subtitle" id="gameSubtitle">Oathbreaker | 中世紀奇幻戰略敘事</div>
      </div>
      <div class="char-avatars" id="charAvatars"></div>
    </div>
    <div class="banner-stats" id="bannerStats"></div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <input type="text" class="search-box" id="searchBox" placeholder="搜尋段落、角色、場景...">
    </div>
    <div class="toolbar-right">
      <label class="toggle-row">
        <input type="checkbox" id="showZh" checked>
        <span>中文</span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="showEn">
        <span>英文</span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="showChoices" checked>
        <span>選項</span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="showCond">
        <span>條件</span>
      </label>
      <div class="view-toggle">
        <button class="view-btn active" data-view="narrative" id="viewNarrative">敘事</button>
        <button class="view-btn" data-view="scene" id="viewScene">場景</button>
        <button class="view-btn" data-view="character" id="viewChar">角色</button>
        <button class="view-btn" data-view="gallery" id="viewGallery">圖庫</button>
      </div>
    </div>
  </div>

  <div id="filterBar" class="toolbar" style="display:none; padding:4px 16px; border-top:none;">
    <div class="filter-row" id="filterRow"></div>
  </div>

  <div class="content" id="content">
    <div class="loading">
      <div class="spinner"></div>
      <div>載入敘事數據中...</div>
    </div>
  </div>
</div>

<div class="kb-hint">
  <kbd>/</kbd> 搜尋 &nbsp; <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> 切換視圖 &nbsp; <kbd>Esc</kbd> 清除
</div>

<script>
// ============================================================
// Oathbreaker - Enhanced Narrative Viewer
// Medieval fantasy tactical RPG - dark betrayal theme
// ============================================================

// === Constants ===
const CHUNK_SIZE = 60;

// Character face portrait images
const CHAR_FACES = {
  'Pup': 'images/faces/pup.png', 'Charlotte': 'images/faces/charlotte.png',
  'Norde': 'images/faces/norde.png', 'Rowan': 'images/faces/rowan.png',
  'Kara': 'images/faces/kara.png', 'Castel': 'images/faces/castel.png',
  'Mariel': 'images/faces/mariel.png', 'Satia': 'images/faces/satia.png',
  'Otis': 'images/faces/otis.png', 'Tatiana': 'images/faces/tatiana.png',
  'Elliot': 'images/faces/elliot.png', 'Reagyn': 'images/faces/reagyn.png',
  'Jude': 'images/faces/jude.png', 'Flynn': 'images/faces/flynn.png',
  'Nora': 'images/faces/nora.png', 'Bennett': 'images/faces/bennett.png',
  'Aegis': 'images/faces/aegis.png', 'Ivan': 'images/faces/ivan.png',
  'Macy': 'images/faces/macy.png', 'Jenny': 'images/faces/jenny.png',
  'Atticus': 'images/faces/atticus.png', 'Jakson': 'images/faces/jakson.png',
  'Liebra': 'images/faces/liebra.png'
};

// Character full illustrations (from charillust/)
const CHAR_ILLUST = {
  'Pup': 'images/pup.png', 'Charlotte': 'images/charlotte.png',
  'Kara': 'images/kara.png', 'Aegis': 'images/aegis.png',
  'Rowan': 'images/rowan.png'
};

// CG Gallery images
const CG_IMAGES = [
  { src: 'images/cg/battle.jpg', title: '戰鬥場景', en: 'Battle Scene' },
  { src: 'images/cg/worldmap.jpg', title: '世界地圖', en: 'World Map' },
  { src: 'images/cg/pup_kara.jpg', title: 'Pup 與 Kara', en: 'Pup & Kara' },
  { src: 'images/cg/pup_deck.jpg', title: '甲板場景', en: 'Pup on Deck' },
  { src: 'images/cg/pup_sick.jpg', title: 'Pup 生病', en: 'Pup Sick' },
  { src: 'images/cg/locket.jpg', title: '墜飾', en: 'Locket' },
  { src: 'images/cg/mirror.jpg', title: '鏡子', en: 'Mirror CG' },
  { src: 'images/cg/shopping.jpg', title: '購物場景', en: 'Shopping' }
];

// Character color palette - dark medieval tones
const CHAR_COLORS = {
  'Pup': '#c62828', 'Charlotte': '#8e24aa', 'Norde': '#1565c0',

// === State ===
let DATA = null;
let searchQuery = '';
let showZh = true;
let showEn = false;
let showChoices = true;
let showCond = false;
let currentView = 'narrative';
let openSections = new Set();
let charFilter = null;
let detectedCharacters = [];

// === Data Loading ===
async function loadData() {
  try {
    const resp = await fetch('data/passages.json?v=' + Date.now());
    DATA = await resp.json();
    if (!DATA.meta.has_zh) {
      document.getElementById('showZh').parentElement.style.display = 'none';
      showZh = false;
      showEn = true;
      document.getElementById('showEn').checked = true;
    }
    detectCharacters();
    init();
  } catch(e) {
    document.getElementById('content').innerHTML =
      '<div class="empty-state">載入失敗: ' + e.message + '</div>';
  }
}

// === Character Detection from Content ===
function detectCharacters() {
  const counts = {};
  const speakerRe = /^([A-Z][a-z]+(?:\s[A-Z][a-z]+)?)\s*:/gm;
  DATA.passages.forEach(p => {
    const content = p.content || '';
    let m;
    speakerRe.lastIndex = 0;
    const localRe = /^([A-Z][a-z]+(?:\s[A-Z][a-z]+)?)\s*:/gm;
    while ((m = localRe.exec(content)) !== null) {
      const name = m[1];
      // Filter out common non-character words
      if (['The', 'This', 'That', 'But', 'And', 'Not', 'You', 'Your', 'His', 'Her',
           'They', 'There', 'When', 'What', 'Where', 'Who', 'How', 'Why', 'Yes', 'No',
           'If', 'Or', 'So', 'As', 'At', 'In', 'On', 'By', 'To', 'Up', 'Do'].includes(name)) continue;
      counts[name] = (counts[name] || 0) + 1;
    }
    // Also assign detected characters to passages
    const pChars = new Set();
    const localRe2 = /^([A-Z][a-z]+(?:\s[A-Z][a-z]+)?)\s*:/gm;
    while ((m = localRe2.exec(content)) !== null) {
      if (counts[m[1]] >= 5) pChars.add(m[1]);
    }
    if (pChars.size > 0 && (!p.characters || p.characters.length === 0)) {
      p.characters = Array.from(pChars);
    }
  });

  // Top characters by frequency (min 20 mentions)
  detectedCharacters = Object.entries(counts)
    .filter(([_, c]) => c >= 20)
    .sort((a, b) => b[1] - a[1])
    .map(([name]) => name);

  // Store in meta for banner
  if (!DATA.meta.characters || DATA.meta.characters.length === 0) {
    DATA.meta.characters = detectedCharacters.slice(0, 15);
  }
}

// === Banner ===
function renderBanner() {
  const m = DATA.meta;
  const total = m.total || DATA.passages.length;
  const chars = m.characters || [];
  const groups = (DATA.groups || []).length;
  const zhCount = m.translated_count || DATA.passages.filter(p => p.content_zh).length;
  const pct = total > 0 ? Math.round(zhCount / total * 100) : 0;
  const totalChoices = m.total_choices || DATA.passages.reduce((s, p) => s + (p.choices || []).length, 0);

  document.getElementById('bannerStats').innerHTML =
    `<span class="stat-item"><b>${groups}</b> 分類</span>` +
    `<span class="stat-item"><b>${total.toLocaleString()}</b> 段落</span>` +
    (totalChoices > 0 ? `<span class="stat-item"><b>${totalChoices.toLocaleString()}</b> 選項</span>` : '') +
    `<span class="stat-item"><b>${chars.length}</b> 角色</span>` +
    `<span class="stat-item" style="color:${pct>=95?'#66bb6a':'#ffab00'}">${pct}% 已翻譯</span>`;

  // Character avatars in banner (with face images)
  const avatarBox = document.getElementById('charAvatars');
  avatarBox.innerHTML = chars.slice(0, 8).map(c => {
    const color = CHAR_COLORS[c] || '#546e7a';
    const face = CHAR_FACES[c];
    if (face) {
      return `<div class="char-avatar" style="border-color:${color}66" title="${c}" onclick="filterByChar('${c}')"><img src="${face}" alt="${c}" loading="lazy"></div>`;
    }
    return `<div class="char-avatar" style="background:${color}" title="${c}" onclick="filterByChar('${c}')">${c[0]}</div>`;
  }).join('');
}

// === Filtering ===
function getFiltered() {
  let passages = DATA.passages;
  if (charFilter) {
    passages = passages.filter(p => (p.characters || []).includes(charFilter));
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    passages = passages.filter(p =>
      (p.content_zh || '').toLowerCase().includes(q) ||
      (p.content || '').toLowerCase().includes(q) ||
      (p.name || '').toLowerCase().includes(q) ||
      (p.title || '').toLowerCase().includes(q) ||
      (p.group || '').toLowerCase().includes(q) ||
      (p.characters || []).some(c => c.toLowerCase().includes(q))
    );
  }
  return passages;
}

function filterByChar(name) {
  if (charFilter === name) {
    charFilter = null;
  } else {
    charFilter = name;
  }
  updateFilterBar();
  resetAndRender();
}

function updateFilterBar() {
  const bar = document.getElementById('filterBar');
  const row = document.getElementById('filterRow');
  const chars = DATA.meta.characters || [];
  if ((currentView === 'character' || charFilter) && chars.length > 0) {
    bar.style.display = 'flex';
    row.innerHTML = chars.map(c => {
      const color = CHAR_COLORS[c] || '#546e7a';
      const active = charFilter === c ? ' active' : '';
      return `<button class="filter-chip${active}" style="${charFilter===c?`background:${color}22;border-color:${color};color:${color}`:''}" onclick="filterByChar('${c}')">${c}</button>`;
    }).join('') + (charFilter ? `<button class="filter-chip" style="color:var(--warm)" onclick="filterByChar(null);charFilter=null;updateFilterBar();resetAndRender();">清除</button>` : '');
  } else {
    bar.style.display = 'none';
  }
}

// === Passage Title ===
function getPassageTitle(p) {
  if (p.title && p.title.length > 2 && p.title.length < 80) return p.title;
  const name = p.name || '';
  if (name && !/^(g\d|passage_|p\d|#|\d+$)/.test(name) && name.length > 2 && name.length < 80) return name;
  if (p.content_zh) {
    const first = p.content_zh.replace(/\[.*?\]/g, '').split(/[\u3002\uff01\uff1f\n]/)[0].trim();
    if (first.length > 4) return first.length > 50 ? first.substring(0, 47) + '...' : first;
  }
  if (p.content) {
    const first = p.content.replace(/\[.*?\]/g, '').split(/[.!?\n]/)[0].trim();
    if (first.length > 4) return first.length > 50 ? first.substring(0, 47) + '...' : first;
  }
  return name || 'Passage ' + p.pid;
}

// === Condition Extraction ===
function extractConditions(text) {
  if (!text) return [];
  const conds = [];
  const re = /<<(?:else)?if\s+([^>]+?)>>/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    conds.push(m[1].trim());
  }
  return conds;
}

// === Text Formatting ===
function formatText(s) {
  if (!s) return '';
  let text = s;
  // Extract <img> tags before escaping
  const imgs = [];
  text = text.replace(/<img\s[^>]*>/gi, m => {
    const i = imgs.length;
    let tag = m;
    if (!/class=/.test(tag)) tag = tag.replace('<img', '<img class="passage-img"');
    if (!/loading=/.test(tag)) tag = tag.replace('<img', '<img loading="lazy"');
    imgs.push(tag);
    return ' IMG' + i + ' ';
  });
  // Strip Twine macros
  text = text.replace(/<<[^>]*?>>/g, '');
  // Strip [[link]] syntax
  text = text.replace(/\[\[([^\]|]*?)(?:\|[^\]]*?)?\]\]/g, '');
  text = text.replace(/==[^=]*?==/g, '');
  text = text.replace(/\[OR\]/g, '\n');
  text = text.replace(/\n{3,}/g, '\n\n').trim();
  // Escape HTML
  let html = escHtml(text);
  // Restore <img> tags
  html = html.replace(/ IMG(\d+) /g, (_, i) => imgs[+i]);
  // Markdown images
  html = html.replace(/!\[img\]\(([^)]+)\)/g, '<img src="$1" class="passage-img" loading="lazy" alt="">');
  // Twine [img[path]] syntax
  html = html.replace(/\[img\[([^\]]+?)\](?:\[[^\]]*\])?\]/g, '<img src="$1" class="passage-img" loading="lazy" alt="">');
  // Paragraphs
  html = html.replace(/\n\n+/g, '</p><p>').replace(/\n/g, '<br>');
  return '<p>' + html + '</p>';
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// === Tag Class ===
function tagClass(tag) {
  const t = (tag || '').toLowerCase();
  if (['character', 'npc'].includes(t)) return 'tag-char';
  if (['condition', 'branch'].includes(t)) return 'tag-cond';
  return 'tag-default';
}

// === Passage HTML ===
function passageHtml(p) {
  const title = getPassageTitle(p);
  const pid = p.pid != null ? `<span class="pid">#${p.pid}</span>` : '';

  // Tags
  const tags = (p.tags && p.tags.length > 0)
    ? `<div class="tag-row">${p.tags.map(t => `<span class="tag ${tagClass(t)}">${escHtml(t)}</span>`).join('')}</div>`
    : '';

  // Characters (with face icons)
  const chars = (p.characters && p.characters.length > 0)
    ? `<div class="char-pills">${p.characters.map(c => {
        const color = CHAR_COLORS[c] || '#546e7a';
        const face = CHAR_FACES[c];
        const icon = face
          ? `<img src="${face}" alt="" style="width:16px;height:16px;border-radius:50%;object-fit:cover;vertical-align:middle">`
          : '';
        return `<span class="char-pill" style="background:${color}18;color:${color};border:1px solid ${color}33" onclick="filterByChar('${c}')">${icon}${c}</span>`;
      }).join('')}</div>`
    : '';

  // Condition tags
  let condHtml = '';
  if (showCond) {
    const conds = extractConditions(p.content || '');
    if (conds.length > 0) {
      condHtml = `<div class="tag-row">${conds.slice(0, 5).map(c =>
        `<span class="tag tag-cond" title="${escHtml(c)}">${escHtml(c.length > 30 ? c.substring(0,27)+'...' : c)}</span>`
      ).join('')}</div>`;
    }
  }

  // Text content
  const TEXT_LIMIT = 5000;
  let textHtml = '';
  if (showZh && p.content_zh) {
    const t = p.content_zh.length > TEXT_LIMIT ? p.content_zh.substring(0, TEXT_LIMIT) : p.content_zh;
    const trunc = p.content_zh.length > TEXT_LIMIT ? `<div style="color:var(--tag-cond);font-size:11px;margin-top:4px">... 內容過長，已截斷 (${(p.content_zh.length/1000).toFixed(0)}K 字元)</div>` : '';
    textHtml += `<div class="text">${formatText(t)}</div>${trunc}`;
  }
  if (showEn && p.content) {
    const t = p.content.length > TEXT_LIMIT ? p.content.substring(0, TEXT_LIMIT) : p.content;
    const trunc = p.content.length > TEXT_LIMIT ? `<div style="color:var(--tag-cond);font-size:11px;margin-top:4px">... truncated (${(p.content.length/1000).toFixed(0)}K chars)</div>` : '';
    if (showZh && p.content_zh) {
      const isLong = t.length > 300;
      textHtml += `<div class="text-en${isLong ? ' collapsed' : ''}">${formatText(t)}</div>${trunc}`;
    } else {
      textHtml += `<div class="text">${formatText(t)}</div>${trunc}`;
    }
  }
  if (!textHtml) {
    textHtml = p.content_zh
      ? `<div class="text">${formatText(p.content_zh.length > TEXT_LIMIT ? p.content_zh.substring(0, TEXT_LIMIT) : p.content_zh)}</div>`
      : p.content
        ? `<div class="text">${formatText(p.content.length > TEXT_LIMIT ? p.content.substring(0, TEXT_LIMIT) : p.content)}</div>`
        : '<div class="text" style="color:var(--text3)">(empty)</div>';
  }

  // Choices
  const CHOICE_LIMIT = 20;
  let choicesHtml = '';
  if (showChoices && p.choices && p.choices.length > 0) {
    const shown = p.choices.slice(0, CHOICE_LIMIT);
    const overflow = p.choices.length > CHOICE_LIMIT ? `<span style="font-size:11px;color:var(--text2)">+${p.choices.length - CHOICE_LIMIT} 更多</span>` : '';
    choicesHtml = `<div class="choices-row">${shown.map(c =>
      `<span class="choice-btn" title="-> ${escHtml(c.target || '')}">${escHtml(c.text)}</span>`
    ).join('')}${overflow}</div>`;
  }

  return `<div class="passage">
    <div class="passage-header">
      <span class="passage-title">${escHtml(title)}</span>
      ${pid}
    </div>
    ${tags}${condHtml}${chars}${textHtml}${choicesHtml}
  </div>`;
}

// === Chunked Rendering ===
function renderChunked(container, passages, startIdx) {
  const end = Math.min(startIdx + CHUNK_SIZE, passages.length);
  let html = '';
  for (let i = startIdx; i < end; i++) {
    html += passageHtml(passages[i]);
  }
  container.insertAdjacentHTML('beforeend', html);

  if (end < passages.length) {
    const sentinel = document.createElement('div');
    sentinel.className = 'loading';
    sentinel.style.padding = '16px';
    sentinel.innerHTML = `<div style="font-size:11px;color:var(--text3)">載入更多 (${end}/${passages.length})...</div>`;
    container.appendChild(sentinel);

    const obs = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting) {
        obs.disconnect();
        sentinel.remove();
        renderChunked(container, passages, end);
      }
    });
    obs.observe(sentinel);
  }
}

// === Narrative View (by group) ===
function renderNarrativeView(passages) {
  const content = document.getElementById('content');
  content.innerHTML = '';
  const groups = groupPassages(passages);

  if (groups.length === 0) {
    content.innerHTML = '<div class="empty-state">未找到匹配的段落</div>';
    return;
  }

  groups.forEach(([gName, gPassages]) => {
    const isOpen = openSections.has('g:' + gName);
    const icon = GROUP_ICONS[gName] || ['#546e7a', gName.substring(0,2).toUpperCase()];
    const nameZh = GROUP_NAMES_ZH[gName] || gName;
    const charCount = new Set(gPassages.flatMap(p => p.characters || [])).size;

    const header = document.createElement('div');
    header.className = 'group-header';

    // Chapter-specific gradient backgrounds
    const isChapter = gName.startsWith('Chapter');
    const chNum = isChapter ? parseInt(gName.replace('Chapter ', '')) : 0;
    if (isChapter) {
      const hue = 350 + (chNum * 8); // Shift from dark red to purple
      header.style.background = `linear-gradient(135deg, hsl(${hue % 360}, 40%, 12%), var(--bg2))`;
    } else if (gName === 'Support Conversations') {
      header.style.background = 'linear-gradient(135deg, #1a0520, var(--bg2))';
    } else if (gName === 'Supply Runs') {
      header.style.background = 'linear-gradient(135deg, #1a1005, var(--bg2))';
    } else if (gName === 'Paralogues') {
      header.style.background = 'linear-gradient(135deg, #051a1a, var(--bg2))';
    }

    header.innerHTML = `
      <div class="group-icon" style="background:${icon[0]}22;color:${icon[0]}">${icon[1]}</div>
      <span class="group-arrow${isOpen ? ' open' : ''}">&#9654;</span>
      <div class="group-info">
        <h2>${escHtml(nameZh)}</h2>
        <div class="group-name-en">${escHtml(gName)}</div>
      </div>
      <div class="group-stats">
        ${charCount > 0 ? `<span>${charCount} 角色</span>` : ''}
        <span><b>${gPassages.length}</b> 段落</span>
      </div>
    `;

    const body = document.createElement('div');
    body.className = 'group-body' + (isOpen ? ' open' : '');

    header.addEventListener('click', () => {
      const nowOpen = body.classList.toggle('open');
      header.querySelector('.group-arrow').classList.toggle('open', nowOpen);
      if (nowOpen) {
        openSections.add('g:' + gName);
        if (!body.dataset.rendered) {
          renderChunked(body, gPassages, 0);
          body.dataset.rendered = '1';
        }
      } else {
        openSections.delete('g:' + gName);
      }
    });

    if (isOpen && !body.dataset.rendered) {
      renderChunked(body, gPassages, 0);
      body.dataset.rendered = '1';
    }

    content.appendChild(header);
    content.appendChild(body);
  });
}

function groupPassages(passages) {
  const groups = new Map();
  passages.forEach(p => {
    const g = p.group || '(uncategorized)';
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(p);
  });
  if (DATA.groups && DATA.groups.length > 0) {
    const ordered = [];
    const seen = new Set();
    DATA.groups.forEach(gi => {
      const key = gi.id || gi.name;
      if (groups.has(key)) { ordered.push([key, groups.get(key)]); seen.add(key); }
    });
    groups.forEach((v, k) => { if (!seen.has(k)) ordered.push([k, v]); });
    return ordered;
  }
  return Array.from(groups.entries()).sort((a, b) => b[1].length - a[1].length);
}

// === Scene View (group -> character sub-groups) ===
function renderSceneView(passages) {
  const content = document.getElementById('content');
  content.innerHTML = '';

  if (passages.length === 0) {
    content.innerHTML = '<div class="empty-state">未找到匹配的段落</div>';
    return;
  }

  const groups = groupPassages(passages);

  groups.forEach(([gName, gPassages]) => {
    const icon = GROUP_ICONS[gName] || ['#546e7a', gName.substring(0,2).toUpperCase()];
    const nameZh = GROUP_NAMES_ZH[gName] || gName;
    const isOpen = openSections.has('sv:' + gName);

    // Sub-group by primary character
    const charSubs = new Map();
    gPassages.forEach(p => {
      const chars = p.characters || [];
      const key = chars.length > 0 ? chars[0] : '(general)';
      if (!charSubs.has(key)) charSubs.set(key, []);
      charSubs.get(key).push(p);
    });
    const subCount = charSubs.size;

    const header = document.createElement('div');
    header.className = 'group-header';
    const isChapter = gName.startsWith('Chapter');
    const chNum = isChapter ? parseInt(gName.replace('Chapter ', '')) : 0;
    if (isChapter) {
      const hue = 350 + (chNum * 8);
      header.style.background = `linear-gradient(135deg, hsl(${hue % 360}, 40%, 12%), var(--bg2))`;
    }

    header.innerHTML = `
      <div class="group-icon" style="background:${icon[0]}22;color:${icon[0]}">${icon[1]}</div>
      <span class="group-arrow${isOpen ? ' open' : ''}">&#9654;</span>
      <div class="group-info">
        <h2>${escHtml(nameZh)}</h2>
        <div class="group-name-en">${escHtml(gName)} &middot; ${subCount} 子場景</div>
      </div>
      <div class="group-stats"><b>${gPassages.length}</b> 段落</div>
    `;

    const body = document.createElement('div');
    body.className = 'group-body' + (isOpen ? ' open' : '');

    header.addEventListener('click', () => {
      const nowOpen = body.classList.toggle('open');
      header.querySelector('.group-arrow').classList.toggle('open', nowOpen);
      if (nowOpen) {
        openSections.add('sv:' + gName);
        if (!body.dataset.rendered) {
          renderSceneSubs(body, charSubs, gName);
          body.dataset.rendered = '1';
        }
      } else {
        openSections.delete('sv:' + gName);
      }
    });

    if (isOpen && !body.dataset.rendered) {
      renderSceneSubs(body, charSubs, gName);
      body.dataset.rendered = '1';
    }

    content.appendChild(header);
    content.appendChild(body);
  });
}

function renderSceneSubs(container, charSubs, groupName) {
  const sorted = Array.from(charSubs.entries()).sort((a, b) => {
    if (a[0] === '(general)') return 1;
    if (b[0] === '(general)') return -1;
    return b[1].length - a[1].length;
  });

  sorted.forEach(([charName, subPassages]) => {
    const secKey = 'ss:' + groupName + ':' + charName;
    const isOpen = openSections.has(secKey);
    const color = CHAR_COLORS[charName] || '#546e7a';
    const isGeneral = charName === '(general)';

    const face = CHAR_FACES[charName];
    const sub = document.createElement('div');
    sub.className = 'char-section';
    sub.style.margin = '4px 0';
    sub.innerHTML = `
      <div class="char-section-header" style="padding:10px 14px">
        <div class="char-section-avatar" style="background:${color};width:36px;height:36px;font-size:13px">
          ${isGeneral ? '?' : face ? `<img src="${face}" alt="${escHtml(charName)}" loading="lazy">` : charName[0]}
        </div>
        <div class="char-section-info">
          <h3 style="font-size:14px">${isGeneral ? '一般場景' : escHtml(charName)}</h3>
          <div class="meta">${subPassages.length} 段落</div>
        </div>
        <span class="group-arrow${isOpen ? ' open' : ''}">&#9654;</span>
      </div>
    `;

    const subBody = document.createElement('div');
    subBody.className = 'char-section-body' + (isOpen ? ' open' : '');

    sub.querySelector('.char-section-header').addEventListener('click', () => {
      const nowOpen = subBody.classList.toggle('open');
      sub.querySelector('.group-arrow').classList.toggle('open', nowOpen);
      if (nowOpen) {
        openSections.add(secKey);
        if (!subBody.dataset.rendered) {
          renderChunked(subBody, subPassages, 0);
          subBody.dataset.rendered = '1';
        }
      } else {
        openSections.delete(secKey);
      }
    });

    if (isOpen && !subBody.dataset.rendered) {
      renderChunked(subBody, subPassages, 0);
      subBody.dataset.rendered = '1';
    }

    sub.appendChild(subBody);
    container.appendChild(sub);
  });
}

// === Character View ===
function renderCharacterView(passages) {
  const content = document.getElementById('content');
  content.innerHTML = '';

  const charMap = new Map();
  passages.forEach(p => {
    (p.characters || []).forEach(c => {
      if (!charMap.has(c)) charMap.set(c, []);
      charMap.get(c).push(p);
    });
  });

  const noChar = passages.filter(p => !(p.characters && p.characters.length > 0));

  if (charMap.size === 0 && noChar.length === 0) {
    content.innerHTML = '<div class="empty-state">未找到匹配的段落</div>';
    return;
  }

  const sorted = Array.from(charMap.entries()).sort((a, b) => b[1].length - a[1].length);

  sorted.forEach(([charName, charPassages]) => {
    if (charFilter && charFilter !== charName) return;

    const isOpen = openSections.has('c:' + charName);
    const color = CHAR_COLORS[charName] || '#546e7a';
    const groups = {};
    charPassages.forEach(p => {
      const g = p.group || 'other';
      groups[g] = (groups[g] || 0) + 1;
    });
    const groupStr = Object.entries(groups).map(([k,v]) => `${GROUP_NAMES_ZH[k]||k} ${v}`).join(' / ');

    const face = CHAR_FACES[charName];
    const illust = CHAR_ILLUST[charName];

    const section = document.createElement('div');
    section.className = 'char-section';
    section.innerHTML = `
      <div class="char-section-header">
        <div class="char-section-avatar" style="background:${color}">
          ${face ? `<img src="${face}" alt="${escHtml(charName)}" loading="lazy">` : charName[0]}
        </div>
        <div class="char-section-info">
          <h3>${escHtml(charName)}</h3>
          <div class="meta">${charPassages.length} 段落 | ${groupStr}</div>
        </div>
        <span class="group-arrow${isOpen ? ' open' : ''}">&#9654;</span>
      </div>
    `;

    const body = document.createElement('div');
    body.className = 'char-section-body' + (isOpen ? ' open' : '');

    function renderCharBody() {
      if (illust) {
        body.insertAdjacentHTML('beforeend',
          `<img src="${illust}" alt="${escHtml(charName)}" class="char-portrait-full" loading="lazy">`);
      }
      renderChunked(body, charPassages, 0);
    }

    section.querySelector('.char-section-header').addEventListener('click', () => {
      const nowOpen = body.classList.toggle('open');
      section.querySelector('.group-arrow').classList.toggle('open', nowOpen);
      if (nowOpen) {
        openSections.add('c:' + charName);
        if (!body.dataset.rendered) {
          renderCharBody();
          body.dataset.rendered = '1';
        }
      } else {
        openSections.delete('c:' + charName);
      }
    });

    if (isOpen && !body.dataset.rendered) {
      renderCharBody();
      body.dataset.rendered = '1';
    }

    section.appendChild(body);
    content.appendChild(section);
  });

  // No-character passages
  if (noChar.length > 0 && !charFilter) {
    const isOpen = openSections.has('c:__none');
    const section = document.createElement('div');
    section.className = 'char-section';
    section.innerHTML = `
      <div class="char-section-header">
        <div class="char-section-avatar" style="background:var(--text3)">?</div>
        <div class="char-section-info">
          <h3>無特定角色</h3>
          <div class="meta">${noChar.length} 段落</div>
        </div>
        <span class="group-arrow${isOpen ? ' open' : ''}">&#9654;</span>
      </div>
    `;
    const body = document.createElement('div');
    body.className = 'char-section-body' + (isOpen ? ' open' : '');

    section.querySelector('.char-section-header').addEventListener('click', () => {
      const nowOpen = body.classList.toggle('open');
      section.querySelector('.group-arrow').classList.toggle('open', nowOpen);
      if (nowOpen) {
        openSections.add('c:__none');
        if (!body.dataset.rendered) {
          renderChunked(body, noChar, 0);
          body.dataset.rendered = '1';
        }
      } else {
        openSections.delete('c:__none');
      }
    });
    if (isOpen && !body.dataset.rendered) {
      renderChunked(body, noChar, 0);
      body.dataset.rendered = '1';
    }
    section.appendChild(body);
    content.appendChild(section);
  }
}

// === Gallery View ===
function renderGalleryView() {
  const content = document.getElementById('content');
  content.innerHTML = '';

  // Character Portraits section
  const charTitle = document.createElement('div');
  charTitle.className = 'group-header';
  charTitle.style.cursor = 'default';
  charTitle.innerHTML = `
    <div class="group-icon" style="background:${CHAR_COLORS['Pup']}22;color:${CHAR_COLORS['Pup']}">FP</div>
    <div class="group-info">
      <h2>角色立繪</h2>
      <div class="group-name-en">Character Portraits</div>
    </div>
    <div class="group-stats"><b>${Object.keys(CHAR_ILLUST).length}</b> 角色</div>
  `;
  content.appendChild(charTitle);

  const portraitGrid = document.createElement('div');
  portraitGrid.className = 'cg-gallery';
  portraitGrid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(140px, 1fr))';

  Object.entries(CHAR_ILLUST).forEach(([name, src]) => {
    const color = CHAR_COLORS[name] || '#546e7a';
    portraitGrid.innerHTML += `
      <div class="cg-item" onclick="openLightbox('${src}')">
        <img src="${src}" alt="${escHtml(name)}" loading="lazy">
        <div class="cg-label" style="background:linear-gradient(transparent, ${color}cc)">${escHtml(name)}</div>
      </div>
    `;
  });
  content.appendChild(portraitGrid);

  // Face sprites section
  const faceTitle = document.createElement('div');
  faceTitle.className = 'group-header';
  faceTitle.style.cursor = 'default';
  faceTitle.style.marginTop = '16px';
  faceTitle.innerHTML = `
    <div class="group-icon" style="background:#00838f22;color:#00838f">FC</div>
    <div class="group-info">
      <h2>角色頭像</h2>
      <div class="group-name-en">Face Sprites</div>
    </div>
    <div class="group-stats"><b>${Object.keys(CHAR_FACES).length}</b> 角色</div>
  `;
  content.appendChild(faceTitle);

  const faceGrid = document.createElement('div');
  faceGrid.style.display = 'flex';
  faceGrid.style.flexWrap = 'wrap';
  faceGrid.style.gap = '12px';
  faceGrid.style.padding = '12px 0';

  Object.entries(CHAR_FACES).forEach(([name, src]) => {
    const color = CHAR_COLORS[name] || '#546e7a';
    faceGrid.innerHTML += `
      <div style="text-align:center;width:80px">
        <img src="${src}" alt="${escHtml(name)}" style="width:64px;height:64px;border-radius:50%;border:2px solid ${color};display:block;margin:0 auto 4px" loading="lazy">
        <div style="font-size:11px;color:var(--text2)">${escHtml(name)}</div>
      </div>
    `;
  });
  content.appendChild(faceGrid);

  // CG Gallery section
  const cgTitle = document.createElement('div');
  cgTitle.className = 'group-header';
  cgTitle.style.cursor = 'default';
  cgTitle.style.marginTop = '16px';
  cgTitle.innerHTML = `
    <div class="group-icon" style="background:#c6282822;color:#c62828">CG</div>
    <div class="group-info">
      <h2>場景 CG</h2>
      <div class="group-name-en">Scene Gallery</div>
    </div>
    <div class="group-stats"><b>${CG_IMAGES.length}</b> 張</div>
  `;
  content.appendChild(cgTitle);

  const cgGrid = document.createElement('div');
  cgGrid.className = 'cg-gallery';
  CG_IMAGES.forEach(cg => {
    cgGrid.innerHTML += `
      <div class="cg-item" onclick="openLightbox('${cg.src}')">
        <img src="${cg.src}" alt="${escHtml(cg.title)}" loading="lazy">
        <div class="cg-label">${escHtml(cg.title)}</div>
      </div>
    `;
  });
  content.appendChild(cgGrid);
}

function openLightbox(src) {
  const lb = document.createElement('div');
  lb.className = 'cg-lightbox';
  lb.innerHTML = `<span class="close-btn">&times;</span><img src="${src}" alt="">`;
  lb.addEventListener('click', () => lb.remove());
  document.body.appendChild(lb);
}

// === Render Dispatch ===
function resetAndRender() {
  document.querySelectorAll('[data-rendered]').forEach(el => {
    if (!el.classList.contains('open')) el.dataset.rendered = '';
  });

  const passages = getFiltered();

  switch (currentView) {
    case 'narrative': renderNarrativeView(passages); break;
    case 'scene': renderSceneView(passages); break;
    case 'character': renderCharacterView(passages); break;
    case 'gallery': renderGalleryView(); break;
  }
}

function setActiveView(view) {
  currentView = view;
  openSections.clear();
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  const btnId = view === 'narrative' ? 'viewNarrative' : view === 'scene' ? 'viewScene' : view === 'gallery' ? 'viewGallery' : 'viewChar';
  document.getElementById(btnId).classList.add('active');
  updateFilterBar();
  resetAndRender();
}

// === Init ===
function init() {
  renderBanner();
  updateFilterBar();

  let searchTimeout;
  document.getElementById('searchBox').addEventListener('input', e => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
      searchQuery = e.target.value.trim();
      openSections.clear();
      resetAndRender();
    }, 300);
  });

  document.getElementById('showZh').addEventListener('change', e => { showZh = e.target.checked; openSections.clear(); resetAndRender(); });
  document.getElementById('showEn').addEventListener('change', e => { showEn = e.target.checked; openSections.clear(); resetAndRender(); });
  document.getElementById('showChoices').addEventListener('change', e => { showChoices = e.target.checked; openSections.clear(); resetAndRender(); });
  document.getElementById('showCond').addEventListener('change', e => { showCond = e.target.checked; openSections.clear(); resetAndRender(); });

  document.getElementById('viewNarrative').addEventListener('click', () => setActiveView('narrative'));
  document.getElementById('viewScene').addEventListener('click', () => setActiveView('scene'));
  document.getElementById('viewChar').addEventListener('click', () => setActiveView('character'));
  document.getElementById('viewGallery').addEventListener('click', () => setActiveView('gallery'));

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === '/') { e.preventDefault(); document.getElementById('searchBox').focus(); }
    if (e.key === '1') setActiveView('narrative');
    if (e.key === '2') setActiveView('scene');
    if (e.key === '3') setActiveView('character');
    if (e.key === '4') setActiveView('gallery');
    if (e.key === 'Escape') {
      const lb = document.querySelector('.cg-lightbox');
      if (lb) { lb.remove(); return; }
      document.getElementById('searchBox').blur();
      if (charFilter) { charFilter = null; updateFilterBar(); resetAndRender(); }
    }
  });

  resetAndRender();
}

loadData();
</script>
</body>
